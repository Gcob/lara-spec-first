88" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="140.1309" x="102.3225" y="371.7974">Normalize in memory</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="193.7354" x="75.5203" y="454.4297"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="173.7354" x="85.5203" y="476.4966">Stop before the generator.</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.7876" x="85.5203" y="491.6294">Nothing is written</text><ellipse cx="172.3879" cy="536.0625" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="172.3879" cy="536.0625" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><polygon fill="none" points="50.0305,404.8633,294.7454,404.8633,306.7454,416.8633,294.7454,428.8633,50.0305,428.8633,38.0305,416.8633,50.0305,404.8633" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="176.3879" y="440.9302">yes</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="244.7148" x="50.0305" y="421.3638">Did reading collect a document fault?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="306.7454" y="413.7974">no</text><path d="M343.728,586.4961 L343.728,610.1953 L323.728,614.1953 L343.728,618.1953 L343.728,641.8945 A0,0 0 0 0 343.728,641.8945 L523.4004,641.8945 A0,0 0 0 0 523.4004,641.8945 L523.4004,596.4961 L513.4004,586.4961 L343.728,586.4961 A0,0 0 0 0 343.728,586.4961" fill="none" style="stroke:#888888;stroke-width:0.5;"/><path d="M513.4004,586.4961 L513.4004,596.4961 L523.4004,596.4961 L513.4004,586.4961" fill="none" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLeng