<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="844px" preserveAspectRatio="none" style="width:816px;height:844px;" version="1.1" viewBox="0 0 816 844" width="816px" zoomAndPan="magnify"><defs/><g><ellipse cx="280.5833" cy="20" fill="#888888" rx="10" ry="10" style="stroke:#888888;stroke-width:1;"/><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="197.1187" x="182.0239" y="50"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.1187" x="192.0239" y="72.0669">One $ref that names a URL</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#C8706F;stroke-width:0.5;" width="194.9097" x="183.1284" y="154.6992"/><text fill="#C8706F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.9097" x="193.1284" y="176.7661">Refuse, exactly as the root</text><text fill="#C8706F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="144.4409" x="193.1284" y="191.8989">document would have</text><ellipse cx="280.5833" cy="236.332" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="280.5833" cy="236.332" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><polygon fill="none" points="191.6018,105.1328,369.5647,105.1328,381.5647,117.1328,369.5647,129.1328,191.6018,129.1328,179.6018,117.1328,191.6018,105.1328" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="284.5833" y="141.1997">no</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.9629" x="191.6018" y="121.6333">Is the host on the allowlist?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="381.5647" y="114.0669">yes</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#C8706F;stroke-width:0.5;" width="238.3911" x="161.3877" y="338.8984"/><text fill="#C8706F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.3911" x="171.3877" y="360.9653">Refuse. The chain closed on itself</text><text fill="#C8706F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.7241" x="171.3877" y="376.0981">instead of recursing forever</text><ellipse cx="280.5833" cy="420.5313" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="280.5833" cy="420.5313" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><polygon fill="none" points="168.1567,289.332,393.0098,289.332,405.0098,301.332,393.0098,313.332,168.1567,313.332,156.1567,301.332,168.1567,289.332" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="284.5833" y="325.3989">yes</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.853" x="168.1567" y="305.8325">Is that URL already being fetched?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="405.0098" y="298.2661">no</text><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#A17AB8;stroke-width:0.5;" width="68.8008" x="246.1829" y="473.5313"/><text fill="#A17AB8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="48.8008" x="256.1829" y="495.5981">Fetch it</text><path d="M392.4617,526.0977 L392.4617,549.7969 L372.4617,553.7969 L392.4617,557.7969 L392.4617,581.4961 A0,0 0 0 0 392.4617,581.4961 L613.3557,581.4961 A0,0 0 0 0 613.3557,581.4961 L613.3557,536.0977 L603.3557,526.0977 L392.4617,526.0977 A0,0 0 0 0 392.4617,526.0977" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M603.3557,526.0977 L603.3557,536.0977 L613.3557,536.0977 L603.3557,526.0977" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.894" x="398.4617" y="543.1646">This diagram, one hop deeper.</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="149.2461" x="398.4617" y="558.2974">Nothing about depth is</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="92.3203" x="398.4617" y="573.4302">special-cased.</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="183.7568" x="188.7048" y="528.6641"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.7568" x="198.7048" y="550.731">Walk every $ref it names</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="91.292" x="198.7048" y="565.8638">the same way</text><polygon fill="none" points="158.8955,601.4961,402.271,601.4961,414.271,613.4961,402.271,625.4961,158.8955,625.4961,146.8955,613.4961,158.8955,601.4961" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="243.3755" x="158.8955" y="617.9966">Did every reference inside it resolve?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="124.4312" y="610.4302">yes</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="414.271" y="610.4302">no</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="251.791" x="11" y="635.4961"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="188.9888" x="21" y="657.563">Rewrite its own $refs to their</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="231.791" x="21" y="672.6958">local vendored siblings, and write it</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="165.9072" x="53.9419" y="705.7617"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.9072" x="63.9419" y="727.8286">Point the parent's $ref</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="106.6406" x="63.9419" y="742.9614">at the local path</text><ellipse cx="136.8955" cy="802.0273" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="136.8955" cy="802.0273" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#A17AB8;stroke-width:0.5;" width="163.4253" x="342.5583" y="635.4961"/><text fill="#A17AB8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.4253" x="352.5583" y="657.563">Write it exactly as the</text><text fill="#A17AB8" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="114.6387" x="352.5583" y="672.6958">server returned it</text><path d="M537.5237,705.7617 L537.5237,737.0273 L517.5237,741.0273 L537.5237,745.0273 L537.5237,776.293 A0,0 0 0 0 537.5237,776.293 L804.0447,776.293 A0,0 0 0 0 804.0447,776.293 L804.0447,715.7617 L794.0447,705.7617 L537.5237,705.7617 A0,0 0 0 0 537.5237,705.7617" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M794.0447,705.7617 L794.0447,715.7617 L804.0447,715.7617 L794.0447,705.7617" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="228.4966" x="543.5237" y="722.8286">Both halves, or the next build finds</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="245.521" x="543.5237" y="737.9614">no remote $ref left to complain about</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="213.1162" x="543.5237" y="753.0942">and generates a contract quietly</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="134.4434" x="543.5237" y="768.2271">missing the schema.</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#C8706F;stroke-width:0.5;" width="186.5054" x="331.0183" y="715.8945"/><text fill="#C8706F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.5054" x="341.0183" y="737.9614">Remove the parent's $ref</text><text fill="#C8706F" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="148.77" x="341.0183" y="753.0942">rather than rewriting it</text><ellipse cx="424.271" cy="822.293" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="424.271" cy="822.293" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="280.5833" x2="280.5833" y1="30" y2="50"/><polygon fill="#888888" points="276.5833,40,280.5833,50,284.5833,40,280.5833,44" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="280.5833" x2="280.5833" y1="204.9648" y2="225.332"/><polygon fill="#888888" points="276.5833,215.332,280.5833,225.332,284.5833,215.332,280.5833,219.332" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="280.5833" x2="280.5833" y1="129.1328" y2="154.6992"/><polygon fill="#888888" points="276.5833,144.6992,280.5833,154.6992,284.5833,144.6992,280.5833,148.6992" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="381.5647" x2="393.5647" y1="117.1328" y2="117.1328"/><polygon fill="#888888" points="389.5647,195.332,393.5647,205.332,397.5647,195.332,393.5647,199.332" style="stroke:#888888;stroke-width:1;"/><line style=