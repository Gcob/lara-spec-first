xt><g id="Operation.CONC2.Removal.past_sunset"><rect fill="none" height="50" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="114.9546" x="491.4537" y="373.3984"/><line style="stroke:#888888;stroke-width:0.5;" x1="491.4537" x2="606.4083" y1="398.5313" y2="398.5313"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.9546" x="501.4537" y="390.4653">past its sunset</text></g><ellipse cx="548.9337" cy="105.3984" fill="none" rx="10" ry="10" style="stroke:#888888;stroke-width:1;"/><g id="Operation.CONC2.Removal.current"><rect fill="none" height="50" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="67.4106" x="515.2237" y="152.3984"/><line style="stroke:#888888;stroke-width:0.5;" x1="515.2237" x2="582.6344" y1="177.5313" y2="177.5313"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="47.4106" x="525.2237" y="169.4653">current</text></g><g id="Operation.CONC2.Removal.deprecated"><rect fill="none" height="50" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="94.3057" x="501.7737" y="270.3984"/><line style="stroke:#888888;stroke-width:0.5;" x1="501.7737" x2="596.0794" y1="295.5313" y2="295.5313"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="74.3057" x="511.7737" y="287.4653">deprecated</text></g><!--link *start*Removal to current--><g class="link" data-entity-1=".start.Removal" data-entity-2="current" data-source-line="59" data-uid="lnk11" id="link_.start.Removal_current"><path d="M548.9337,115.8384 C548.9337,125.0984 548.9337,133.5884 548.9337,146.0784" fill="none" id="*start*Removal-to-current" style="stroke:#888888;stroke-width:1;"/><polygon fill="#888888" points="548.9337,152.0784,552.9337,143.0784,548.9337,147.0784,544.9337,143.0784,548.9337,152.0784" style="stroke:#888888;stroke-width:1;"/></g><!--link current to deprecated--><g class="link" data-entity-1="current" data-entity-2="deprecated" data-source-line="60" data-uid="lnk13" id="link_current_deprecated"><path d="M548.9337,202.7184 C548.9337,222.5184 548.9337,244.3284 548.9337,264.1084" fill="none" id="current-to-deprecated" style="stroke:#888888;stroke-width:1;"/><polygon fill="#888888" points="548.9337,270.1084,552.9337,261.1084,548.9337,265.1084,544.9337,261.1084,548.9337,270.1084" style="stroke:#888888;stroke-width:1;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="113.6294" x="570.7191" y="233.4653">deprecated: true,</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.2002" x="549.9337" y="248.5981">which requires x-sunset</text></g><!--link deprecated to past_sunset--><g class="link" data-entity-1="deprecated" data-entity-2="past_sunset" data-source-line="61" data-uid="lnk14" id="link_deprecated_past_sunset"><path d="M548.9337,320.8484 C548.9337,336.7284 548.9337,351.3384 548.9337,367.1784" fill="none" id="deprecated-to-past_sunset" style="stroke:#888888;stroke-width:1;"/><polygon fill="#888888" points="548.9337,373.1784,552.9337,364.1784,548.9337,368.1784,544.9337,364.1784,548.9337,373.1784" style="stroke:#888888;stroke-width:1;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="103.6445" x="549.9337" y="351.4653">the date arrives</text></g><g class="entity" data-entity="GMN2" data-source-line="67" data-uid="ent0003" id="entity_GMN2"><path d="M142.79,503.39 L142.79,543.6556 A0,0 0 0 0 142.79,543.6556 L588.3466,543.6556 A0,0 0 0 0 588.3466,543.6556 L588.3466,513.39 L578.3466,503.39 L369.57,503.39 L365.57,443.89 L361.57,503.39 L142.79,503.39 A0,0 0 0 0 142.79,503.39" fill="none" style="stroke:#888888;stroke-width:0.5;"/><path d="M578.3466,503.39 L578.3466,513.39 L588.3466,513.39 L578.3466,503.39" fill="none" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="424.5566" x="148.79" y="520.4569">The two regions are independent. Stable and deprecated is not a</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="396.043" x="148.79" y="535.5897">contradiction, it is a promise kept to its stated removal date.</text></g></g></svg>