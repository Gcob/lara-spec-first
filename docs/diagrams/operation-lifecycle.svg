<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="849px" preserveAspectRatio="none" style="width:494px;height:849px;" version="1.1" viewBox="0 0 494 849" width="494px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="735.6641" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="480.4537" x="7" y="7"/><line style="stroke:#888888;stroke-width:0.5;" x1="7" x2="487.4537" y1="32.1328" y2="32.1328"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="238.0942" x="128.1797" y="24.0669">An operation the document declares</text><rect fill="none" height="287.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="459.4537" x="19" y="44.1328"/><line style="stroke:#888888;stroke-width:0.5;" x1="19" x2="478.4537" y1="84.3984" y2="84.3984"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="170.8662" x="163.2938" y="61.1997">How strong the promise is</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="75.9243" x="163.2938" y="76.3325">(x-lifecycle)</text><g id="Operation.Promise.no_claim"><rect fill="none" height="50" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="75.3262" x="31" y="168.3984"/><line style="stroke:#888888;stroke-width:0.5;" x1="31" x2="106.3262" y1="193.5313" y2="193.5313"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="55.3262" x="41" y="185.4653">no claim</text></g><ellipse cx="203.66" cy="105.3984" fill="none" rx="10" ry="10" style="stroke:#888888;stroke-width:1;"/><g id="Operation.Promise.beta"><rect fill="none" height="50" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="50" x="292.66" y="168.3984"/><line style="stroke:#888888;stroke-width:0.5;" x1="292.66" x2="342.66" y1="193.5313" y2="193.5313"/><text f