alone?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="340.6406" x="32" y="162.5981">Does it touch a migration or the published contract?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="35.5151" x="384.6406" y="139.8989">all no</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="135.6924" x="134.4741" y="312.9473"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.0132" x="144.4741" y="335.0142">Done in this card,</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.6924" x="144.4741" y="350.147">in its own commit</text><polygon fill="none" points="147.9146,383.2129,256.7261,383.2129,268.7261,398.3457,256.7261,413.4785,147.9146,413.4785,135.9146,398.3457,147.9146,383.2129" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.8115" x="147.9146" y="395.2798">Is the card's title</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="60.417" x="147.9146" y="410.4126">still true?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="113.4502" y="395.2798">yes</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="268.7261" y="395.2798">no</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="155.3003" x="36.0536" y="423.4785"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="106.9263" x="46.0536" y="445.5454">The scope grew.</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.3003" x="46.0536" y="460.6782">The body is adjusted</text><rect fill="none" height="65.3984" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="159.166" x="211.3539" y="423.4785"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.4531" x="221.3539" y="445.5454">The goal changed.</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="139.166" x="221.3539" y="460.6782">The card is rewritten,</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.1665" x="221.3539" y="475.811">or closed</text><polygon fill="none" points="202.3203,494.877,214.3203,506.877,202.3203,518.877,190.3203,506.877,202.3203,494.877" style="stroke:#888888;stroke-width:0.5;"/><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="233.2368" x="85.7019" y="538.877"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="213.2368" x="95.7019" y="560.9438">Why the original plan was wrong</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="154.1084" x="95.7019" y="576.0767">goes in the pull request</text><ellipse cx="202.3203" cy="620.1426" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="202.3203" cy="620.1426" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="202.3203" x2="202.3203" y1="30" y2="50"/><polygon fill="#888888" points="198.3203,40,202.3203,50,206.3203,40,202.3203,44" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="202.3203" x2="202.3203" y1="226.3633" y2="248.9473"/><polygon fill="#888888" points="198.3203,238.9473,202.3203,248.9473,206.3203,238.9473,202.3203,242.9473" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="202.3203" x2="202.3203" y1="165.6641" y2=