<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="544px" preserveAspectRatio="none" style="width:914px;height:544px;" version="1.1" viewBox="0 0 914 544" width="914px" zoomAndPan="magnify"><defs/><g><ellipse cx="390.1205" cy="20" fill="#888888" rx="10" ry="10" style="stroke:#888888;stroke-width:1;"/><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="95.3848" x="342.4281" y="50"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="75.3848" x="352.4281" y="72.0669">One finding</text><polygon fill="none" points="341.9767,105.1328,438.2643,105.1328,450.2643,117.1328,438.2643,129.1328,341.9767,129.1328,329.9767,117.1328,341.9767,105.1328" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.2876" x="341.9767" y="121.6333">Who can fix it?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="110.7729" x="219.2037" y="114.0669">the project alone</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="91.4253" x="450.2643" y="114.0669">us, eventually</text><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#5A9662;stroke-width:0.5;" width="120.9722" x="27.5134" y="139.1328"/><text fill="#5A9662" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.9722" x="37.5134" y="161.1997">Document fault</text><path d="M184.999,194.2656 L184.999,233.0977 L164.999,237.0977 L184.999,241.0977 L184.999,279.9297 A0,0 0 0 0 184.999,279.9297 L426.6182,279.9297 A0,0 0 0 0 426.6182,279.9297 L426.6182,204.2656 L416.6182,194.2656 L184.999,194.2656 A0,0 0 0 0 184.999,194.2656" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M416.6182,194.2656 L416.6182,204.2656 L426.6182,204.2656 L416.6182,194.2656" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="167.813" x="190.999" y="211.3325">Per run, not per finding: a</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="220.6191" x="190.999" y="226.4653">document fault always wins when</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="204.5532" x="190.999" y="241.5981">both are present, so the harder</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.3071" x="190.999" y="256.731">failure is never buried under</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.8213" x="190.999" y="271.8638">the softer one's count.</text><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#5A9662;stroke-width:0.5;" width="153.999" x="11" y="219.5313"/><text fill="#5A9662" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="133.999" x="21" y="241.5981">Exit 1, the hard gate</text><ellipse cx="87.9995" cy="325.4648" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="87.9995" cy="325.4648" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#478ECA;stroke-width:0.5;" width="107.4263" x="638.5283" y="139.1328"/><text fill="#478ECA" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="87.4263" x="648.5283" y="161.1997">Package limit</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#478ECA;stroke-width:0.5;" width="225.772" x="579.3555" y="243.832"/><text fill="#478ECA" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="178.4072" x="589.3555" y="265.8989">Reported, and never gates.</text><text fill="#478ECA" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="205.772" x="589.3555" y="281.0317">Our schedule is not their defect</text><ellipse cx="692.2415" cy="339.6328" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="692.2415" cy="339.6328" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><polygon fill="none" points="595.3826,194.2656,789.1003,194.2656,801.1003,206.2656,789.1003,218.2656,595.3826,218.2656,583.3826,206.2656,595.3826,194.2656" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="696.2415" y="230.3325">yes</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="193.7178" x="595.3826" y="210.7661">Is the support level Deferred?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="801.1003" y="203.1997">no</text><polygon fill="none" points="588.2383,392.6328,796.2446,392.6328,808.2446,404.6328,796.2446,416.6328,588.2383,416.6328,576.2383,404.6328,588.2383,392.6328" style="stroke:#888888;stroke-width:0.5;"/><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.0063" x="588.2383" y="409.1333">Acknowledged in configuration?</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4644" x="553.7739" y="401.5669">yes</text><text fill="#888888" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="16.1929" x="808.2446" y="401.5669">no</text><rect fill="none" height="50.2656" rx="12.5" ry="12.5" style="stroke:#478ECA;stroke-width:0.5;" width="219.2402" x="456.6182" y="426.6328"/><text fill="#478ECA" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.5684" x="466.6182" y="448.6997">Reported in its own section,</text><text fill="#478ECA" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.2402" x="466.6182" y="463.8325">with no effect on the exit code</text><ellipse cx="566.2383" cy="522.8984" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="566.2383" cy="522.8984" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><rect fill="none" height="35.1328" rx="12.5" ry="12.5" style="stroke:#478ECA;stroke-width:0.5;" width="171.0806" x="732.7043" y="426.6328"/><text fill="#478ECA" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.0806" x="742.7043" y="448.6997">Exit 2, the softer signal</text><ellipse cx="818.2446" cy="507.7656" fill="none" rx="11" ry="11" style="stroke:#888888;stroke-width:1;"/><ellipse cx="818.2446" cy="507.7656" fill="#888888" rx="6" ry="6" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="390.1205" x2="390.1205" y1="30" y2="50"/><polygon fill="#888888" points="386.1205,40,390.1205,50,394.1205,40,390.1205,44" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="87.9995" x2="87.9995" y1="174.2656" y2="219.5313"/><polygon fill="#888888" points="83.9995,209.5313,87.9995,219.5313,91.9995,209.5313,87.9995,213.5313" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="87.9995" x2="87.9995" y1="254.6641" y2="314.4648"/><polygon fill="#888888" points="83.9995,304.4648,87.9995,314.4648,91.9995,304.4648,87.9995,308.4648" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="692.2415" x2="692.2415" y1="294.0977" y2="328.6328"/><polygon fill="#888888" points="688.2415,318.6328,692.2415,328.6328,696.2415,318.6328,692.2415,322.6328" style="stroke:#888888;stroke-width:1;"/><line style="stroke:#888888;stroke-width:1;" x1="692.2415" x2="692.2415" y1="218.2656" y2="243.832"/><polygon fill="#888888" points="688.2415,233.832,692.2415,243.832,696.2415,233.832,692.2415,237.832"