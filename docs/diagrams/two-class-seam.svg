379.37 L1075.33,383.37 L1075.33,414.6312 A0,0 0 0 0 1075.33,414.6312 L1272.6679,414.6312 A0,0 0 0 0 1272.6679,414.6312 L1272.6679,354.1 L1262.6679,344.1 L1075.33,344.1 A0,0 0 0 0 1075.33,344.1" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M1262.6679,344.1 L1262.6679,354.1 L1272.6679,354.1 L1262.6679,344.1" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="165.7881" x="1081.33" y="361.1669">final unless the operation</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.0425" x="1081.33" y="376.2997">declares x-controller.</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="176.3379" x="1081.33" y="391.4325">getModelClass() is the only</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.2075" x="1081.33" y="406.5653">member the build writes.</text></g><g class="entity" data-entity="GMN28" data-source-line="73" data-uid="ent0029" id="entity_GMN28"><path d="M787.15,606.9 L787.15,677.4313 A0,0 0 0 0 787.15,677.4313 L1044.8414,677.4313 A0,0 0 0 0 1044.8414,677.4313 L1044.8414,616.9 L1034.8414,606.9 L920,606.9 L916,544.27 L912,606.9 L787.15,606.9 A0,0 0 0 0 787.15,606.9" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M1034.8414,606.9 L1034.8414,616.9 L1044.8414,616.9 L1034.8414,606.9" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="236.6914" x="793.15" y="623.9669">routes.php points here when the file</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="231.6387" x="793.15" y="639.0997">exists, and at the generated parent</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="223.3105" x="793.15" y="654.2325">when it does not. Decided at build</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="236.5137" x="793.15" y="669.3653">time, so route:cache keeps working.</text></g><g class="entity" data-entity="GMN31" data-source-line="80" data-uid="ent0032" id="entity_GMN31"><path d="M569.12,13.57 L569.12,68.9684 A0,0 0 0 0 569.12,68.9684 L692,68.9684 L696,199.08 L700,68.9684 L822.8886,68.9684 A0,0 0 0 0 822.8886,68.9684 L822.8886,23.57 L812.8886,13.57 L569.12,13.57 A0,0 0 0 0 569.12,13.57" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M812.8886,13.57 L812.8886,23.57 L822.8886,23.57 L812.8886,13.57" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="214.7222" x="575.12" y="30.6369">The build implements the one its</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="232.7686" x="575.12" y="45.7697">detection produced, and none at all</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.73" x="575.12" y="60.9025">when it read no semantic.</text></g><g class="entity" data-entity="Disclosure" data-source-line="86" data-uid="ent0034" id="entity_Disclosure"><path d="M858.31,6 L858.31,76.5313 L1141.6967,76.5313 L1141.6967,16 L1131.6967,6 L858.31,6" fill="none" style="stroke:#8B8E22;stroke-width:0.5;"/><path d="M1131.6967,6 L1131.6967,16 L1141.6967,16 L1131.6967,6" fill="none" style="stroke:#8B8E22;stroke-width:1;"/><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="262.3867" x="864.31" y="23.0669">Working names, every one of them, and</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.7661" x="864.31" y="38.1997">public API from the first release on.</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.0742" x="864.31" y="53.3325">Read this to see how the pieces fit,</text><text fill="#8B8E22" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.4775" x="864.31" y="68.4653">not as a settled contract.</text></g><!--link CreatesResource to ListsResources--><!--link ListsResources to UpdatesResource--><!--link UpdatesResource to DeletesResource--><!--link DeletesResource to ShowsResource--><!--reverse link SpecController to Parent--><g class="link" data-entity-1="SpecController" data-entity-2="Parent" data-source-line="59" data-uid="lnk20" id="link_SpecController_Parent"><path codeLine="59" d="M861.8185,260.5446 C875.3985,290.0846 888.2,317.92 901.77,347.42" fill="none" id="SpecController-backto-Parent" style="stroke:#888888;stroke-width:1;"/><polygon fill="none" points="854.3,244.19,856.3669,263.0507,867.27,258.0384,854.3,244.19" style="stroke:#888888;stroke-width:1;"/></g><!--reverse link HasModel to Parent--><g class="link" data-entity-1="HasModel" data-entity-2="Parent" data-source-line="60" data-uid="lnk21" id="link_HasModel_Parent"><path codeLine="60" d="M970.915,260.5045 C957.145,290.0445 944.16,317.92 930.42,347.42" fill="none" id="HasModel-backto-Parent" style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="978.52,244.19,965.4768,257.9695,976.3532,263.0395,978.52,244.19" style="stroke:#888888;stroke-width:1;"/></g><!--reverse link InteractsWithModel to Parent--><g class="link" data-entity-1="InteractsWithModel" data-entity-2="Parent" data-source-line="61" data-uid="lnk22" id="link_InteractsWithModel_Parent"><path codeLine="61" d="M1110.5284,247.1045 C1097.3084,256.4945 1087.54,263.34 1074,272.67 C1037.04,298.13 994.76,326.37 963.24,347.25" fill="none" id="InteractsWithModel-backto-Parent" style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#888888" points="1115.42,243.63,1105.7662,245.5806,1111.3436,246.5254,1110.3989,252.1028,1115.42,243.