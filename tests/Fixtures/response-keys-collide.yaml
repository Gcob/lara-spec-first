# A response object whose keys `user-id` and `user_id` both derive the property `$user_id`, so it has no DTO. The second
# operation writes the same two keys but marks one `writeOnly`: a response never sends it, so there is no clash.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  user-id: { type: string }
                  user_id: { type: integer }
  /members:
    get:
      operationId: listMembers
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  user-id: { type: string }
                  user_id: { type: integer, writeOnly: true }
