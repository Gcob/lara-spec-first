# Rejected, and for the same reason as `ref-inside-example.yaml`: an Example
# Object's `value` is literal data by definition, so the `$ref` inside it is a
# literal — until `Pointer`, a Reference Object, aims at the position that value
# occupies and the chain closes back on it.
#
# 3.1 recommends this long form over the `example` keyword, so it is the shape
# most likely to occur, which is why it is pinned separately from the one above.
openapi: "3.1.0"
info:
  title: Fixture API
  version: 1.0.0
paths: {}
components:
  examples:
    SchemaSample:
      summary: an example whose value is itself a JSON Schema document
      value:
        $ref: '#/components/examples/Pointer'
    Pointer:
      $ref: '#/components/examples/SchemaSample/value'
