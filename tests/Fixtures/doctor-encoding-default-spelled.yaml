# One integer part, and nothing else the doctor reports, so its exit code is the whole answer: ``text/plain` is the default of an integer, so the exit stays 0`.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /counts:
    post:
      operationId: createCount
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                count:
                  type: integer
            encoding:
              count:
                contentType: text/plain
      responses:
        '201':
          description: Created
