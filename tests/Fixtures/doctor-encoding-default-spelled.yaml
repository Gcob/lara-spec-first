# One integer part writing `text/plain`, which is an integer's default, so the doctor has nothing to report and its exit is 0.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /counts:
    post:
      operationId: createCount
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                count:
                  type: integer
            encoding:
              count:
                contentType: text/plain
      responses:
        '201':
          description: Created
