# The same self-referential schema as recursive-schema.yaml, written where the
# extractor actually walks it. Accepted as a contract, and infinite as an object
# graph: the walk has to cut it somewhere and say where.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /nodes:
    post:
      operationId: createNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '201':
          description: Created
components:
  schemas:
    Node:
      type: object
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Node'
