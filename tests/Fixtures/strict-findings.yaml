# A request whose only finding says it is stricter than the contract: an avatar written `contentMediaType: image/png`
# is checked with `mimetypes`, which also refuses a file named like PHP whatever its type.
# Nothing here is read and left unenforced, so the build has no warning to print for it.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /avatars:
    post:
      operationId: createAvatar
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  contentMediaType: image/png
      responses:
        '201':
          description: Created
