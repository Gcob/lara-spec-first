# The same contract as its 3.0 twin, written the way 3.1 spells things.
openapi: "3.1.0"
info:
  title: Equivalence API
  version: 1.0.0
paths:
  /users/me:
    get:
      operationId: showCurrentUser
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users:
    post:
      operationId: createUser
      parameters:
        - name: notify
          in: query
          required: true
          schema:
            type: boolean
        - name: locale
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Refused, and no body says how
  /users/{id}:
    get:
      operationId: showUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A user
    delete:
      responses:
        '204':
          description: Gone
components:
  schemas:
    User:
      type: object
      properties:
        name:
          # 3.1 spells the same optional value as a type union.
          type: [string, "null"]
        age:
          type: integer
          # 3.1 spells the same exclusive bound as a number of its own.
          exclusiveMinimum: 0
        role:
          type: string
          # 3.1 has `const`, which is the same claim as a one-value enum.
          const: admin
        tags:
          type: array
          items:
            type: string
          minItems: 1
      # 3.1 spells examples as a list, and it is the spelling that wins.
      examples:
        - name: Ada
      required:
        - name
