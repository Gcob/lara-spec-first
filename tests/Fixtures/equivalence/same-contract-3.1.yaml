# The same contract as its 3.0 twin, written the way 3.1 spells things.
openapi: "3.1.0"
info:
  title: Equivalence API
  version: 1.0.0
paths:
  /users/me:
    get:
      operationId: showCurrentUser
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      operationId: showUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A user
    delete:
      responses:
        '204':
          description: Gone
components:
  schemas:
    User:
      type: object
      properties:
        name:
          # 3.1 spells the same optional value as a type union.
          type: [string, "null"]
        age:
          type: integer
          # 3.1 spells the same exclusive bound as a number of its own.
          exclusiveMinimum: 0
