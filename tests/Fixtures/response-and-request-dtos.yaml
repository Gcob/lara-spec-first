# One schema read by a request and written by a response: the build writes both of
# its DTOs, `UserInputDto` for what comes in and `UserDto` for what goes out.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users/{id}:
    put:
      operationId: replaceUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required: [email]
      properties:
        email: { type: string }
        nickname: { type: string }
