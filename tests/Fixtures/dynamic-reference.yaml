# Dynamic-scope resolution, which is a different feature from the recursive
# schema people reach for it by mistake.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /nodes:
    post:
      operationId: createNode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child:
                  $dynamicRef: '#node'
      responses:
        '201':
          description: Created
