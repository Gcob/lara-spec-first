# One schema, three operations, and one that states nothing about its input.
# Written for the build rather than for the emitter: what it exercises is the
# plan — which operations get a class, which do not, and what a `PUT` and a
# `PATCH` over one schema each come out as.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /posts/{id}:
    put:
      operationId: replacePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Replaced }
    patch:
      operationId: updatePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      operationId: deletePost
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Gone }
components:
  schemas:
    Post:
      type: object
      required: [title, body, published]
      properties:
        title:
          type: string
        body:
          type: string
        published:
          type: boolean
