# A body field and a `query` parameter named `page`: no rule set can hold both, so
# the build plan refuses the operation and Routing outcome says so. The `default`
# beside it was read before any rule set was built, so Support findings still names it.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: createOrder
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: string
                  default: first
      responses:
        '201':
          description: Created
