# Keywords written in a response schema only. `oneOf` changes the type of `payment` and the response DTO cannot say
# it, so the doctor names it. `default` and `deprecated` annotate `status` and change nothing a DTO holds, so it does
# not.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /orders/{id}:
    get:
      operationId: showOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    default: new
                    deprecated: true
                  payment:
                    oneOf:
                      - type: object
                      - type: string
