# The same refusal as prefix-items-hides-a-ref.yaml, written in a response
# rather than in a body. A schema is a schema wherever the document puts it.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /pairs:
    get:
      operationId: listPairs
      responses:
        '200':
          description: The pairs
          content:
            application/json:
              schema:
                type: array
                prefixItems:
                  - type: string
                  - $ref: '#/components/schemas/Amount'
components:
  schemas:
    Amount:
      type: integer
