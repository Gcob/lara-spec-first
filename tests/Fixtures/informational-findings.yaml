# Two requests whose only findings lose no constraint: a `readOnly` property that is required, and the optional fields of
# a `PUT`. Each is said in the generated file, and nothing here is read and left unenforced, so the build has no
# warning to print for it.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /things:
    post:
      operationId: createThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                  readOnly: true
                name:
                  type: string
      responses:
        '201':
          description: Created
  /things/{id}:
    put:
      operationId: replaceThing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: OK
