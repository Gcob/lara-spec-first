# A body field and a `query` parameter named `page`: no rule set can hold both, so
# the build plan refuses the operation and Routing outcome says so. The `default`
# beside it was read before any rule set was built, so Support findings still names it. The `oneOf` in the `201` is a
# response keyword, and the build plan the doctor takes the responses from does not exist, so it is not named.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: createOrder
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: string
                  default: first
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    oneOf:
                      - { type: object }
                      - { type: string }
