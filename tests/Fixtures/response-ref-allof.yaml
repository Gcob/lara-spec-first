# The `allOf` spelling of `response-ref-siblings.yaml`: the DTO files are the same, byte for byte.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: showUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - required: [email]
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        email: { type: string }
