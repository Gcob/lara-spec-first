# Several operations across several paths, written in a deliberate order: the
# document's order settles which route wins, so extraction has to preserve it.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users/me:
    get:
      operationId: showCurrentUser
      responses:
        '200': { description: The caller }
  /users/{id}:
    get:
      operationId: showUser
      responses:
        '200': { description: A user }
    delete:
      responses:
        '204': { description: Gone }
  /posts:
    post:
      operationId: createPost
      responses:
        '201': { description: Created }
