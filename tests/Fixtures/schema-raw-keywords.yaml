# A 3.1 body written with keywords the parser does not model. They come back as
# raw arrays rather than as Schema objects, and the support matrix marks them
# Ignored, so the normal form must not carry them — and must still carry the
# keywords beside them.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /tuples:
    post:
      operationId: createTuple
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $comment: An annotation addressed to a reader, explicitly not to tooling.
              properties:
                pair:
                  type: array
                  minItems: 2
                  prefixItems:
                    - type: string
                    - type: integer
                  unevaluatedItems: false
      responses:
        '201':
          description: Created
