# A response `$ref` with a keyword beside it at 3.1: the schema is the target and what is written beside it, here
# a `required` that makes `email` required. `response-ref-allof.yaml` writes the same schema as an `allOf`.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: showUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
                required: [email]
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        email: { type: string }
