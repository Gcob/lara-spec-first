# Minimal, valid OpenAPI 3.1 document. Quoted version string on purpose: YAML
# reads an unquoted 3.1 as a float.
openapi: "3.1.0"
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: showUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: [string, "null"]
      responses:
        '200':
          description: A user
