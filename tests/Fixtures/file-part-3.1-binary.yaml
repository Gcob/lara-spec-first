# A 3.1 document that still spells a file part the 3.0 way, `type: string` and
# `format: binary`, which is what many generators emit for an upload whatever
# version they declare. Read as a file part, the same as `file-part-3.0.yaml`.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /avatars:
    post:
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
