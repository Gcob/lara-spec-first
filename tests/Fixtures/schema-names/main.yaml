# Every way a schema can and cannot get a name, in one contract, because the
# point is that they agree: decision 7 of the card #35 plan says a name comes
# from the schema the reference lands on and never from how the reference was
# spelled, so three spellings of one schema have to give one name.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /local:
    post:
      operationId: createLocal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalPet'
      responses:
        '201':
          description: Created
  /external:
    post:
      operationId: createExternal
      requestBody:
        content:
          application/json:
            schema:
              $ref: './other.yaml#/components/schemas/Pet'
      responses:
        '201':
          description: Created
  /alias:
    post:
      operationId: createThroughAlias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasOfPet'
      responses:
        '201':
          description: Created
  /from-a-subdirectory:
    post:
      operationId: createFromASubdirectory
      requestBody:
        content:
          application/json:
            schema:
              $ref: './sub/wrapper.yaml#/components/schemas/Wrapper'
      responses:
        '201':
          description: Created
  /whole-file:
    post:
      operationId: createWholeFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: './Address.yaml'
      responses:
        '201':
          description: Created
  /unnameable-file:
    post:
      operationId: createUnnameableFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: './pet-v2.yaml'
      responses:
        '201':
          description: Created
  /inline:
    post:
      operationId: createInline
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
components:
  schemas:
    LocalPet:
      type: object
      properties:
        name:
          type: string
    AliasOfPet:
      $ref: './other.yaml#/components/schemas/Pet'
