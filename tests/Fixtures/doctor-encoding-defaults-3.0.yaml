# The same contract as `doctor-encoding-defaults-3.1.yaml`, read at 3.0. What the pair proves: `count` writes the default
# of both versions (`text/plain` on an integer), `note` writes it at neither (`application/octet-stream` on a plain
# string), and `token` writes the default of 3.0 only (`application/octet-stream` on a `format: byte` string, which
# 3.1.1 gives `text/plain`).
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /parts:
    post:
      operationId: createParts
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                count:
                  type: integer
                note:
                  type: string
                token:
                  type: string
                  format: byte
            encoding:
              count:
                contentType: text/plain
              note:
                contentType: application/octet-stream
              token:
                contentType: application/octet-stream
      responses:
        '201':
          description: Created
