# The same contract as `doctor-encoding-defaults-3.1.yaml`, at 3.0.3. What the pair proves: `count` writes the default of
# both versions (`text/plain` on an integer), `flag` writes the default of neither (`application/octet-stream` on a
# boolean), `note` is no default at 3.0 (`application/octet-stream` on a plain string), and `token`, a `format: byte`
# string, writes the default at 3.0.
openapi: 3.0.3
info:
  title: Fixture API
  version: 1.0.0
paths:
  /parts:
    post:
      operationId: createParts
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                count:
                  type: integer
                flag:
                  type: boolean
                note:
                  type: string
                token:
                  type: string
                  format: byte
            encoding:
              count:
                contentType: text/plain
              flag:
                contentType: application/octet-stream
              note:
                contentType: application/octet-stream
              token:
                contentType: application/octet-stream
      responses:
        '201':
          description: Created
