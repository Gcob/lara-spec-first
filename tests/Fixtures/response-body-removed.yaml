# The contract of response-and-request-dtos.yaml after its response lost its body: the
# build prunes `UserDto` and keeps `UserInputDto`.
openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users/{id}:
    put:
      operationId: replaceUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200': { description: The user }
components:
  schemas:
    User:
      type: object
      required: [email]
      properties:
        email: { type: string }
        nickname: { type: string }
