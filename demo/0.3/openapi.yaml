openapi: 3.1.0
info:
  title: Events and RSVPs
  version: 0.3.0
  description: >-
    A small events API: organizers create events, members RSVP. This is the
    contract the demo for the 0.3 release runs against.
paths:
  /events:
    get:
      operationId: listEvents
      x-controller: App\Http\Controllers\ListEventsController
      tags: [Events]
      summary: List events, optionally by city or from a date
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: false
            properties:
              city:
                type: string
                minLength: 1
                maxLength: 80
              from:
                type: string
                format: date
      responses:
        '200':
          description: The events that match, soonest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '422':
          description: A query parameter does not match the contract.
    post:
      operationId: createEvent
      x-controller: App\Http\Controllers\CreateEventController
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, city, starts_at, capacity]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                city:
                  type: string
                  minLength: 1
                  maxLength: 80
                starts_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: The event was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '422':
          description: The body does not match the contract.
  /events/{event}:
    get:
      operationId: getEvent
      x-controller: App\Http\Controllers\GetEventController
      tags: [Events]
      summary: Read one event
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: No such event.
  /events/{event}/cover:
    post:
      operationId: uploadEventCover
      x-controller: App\Http\Controllers\UploadEventCoverController
      tags: [Events]
      summary: Upload the cover image of an event
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover:
                  type: string
                  format: binary
                  maxLength: 2097152
            encoding:
              cover:
                contentType: image/png, image/jpeg
      responses:
        '200':
          description: The cover was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cover'
        '404':
          description: No such event.
        '422':
          description: The cover is missing, not a PNG or a JPEG, or over 2 MB.
  /events/{event}/rsvps:
    get:
      operationId: listRsvps
      x-controller: App\Http\Controllers\ListRsvpsController
      tags: [RSVPs]
      summary: List who is coming to an event
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The attendees, in the order they replied.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rsvp'
        '404':
          description: No such event.
    post:
      operationId: createRsvp
      x-controller: App\Http\Controllers\CreateRsvpController
      tags: [RSVPs]
      summary: RSVP to an event
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: The RSVP was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rsvp'
        '404':
          description: No such event.
        '409':
          description: The event is full. The contract states this rule, the application keeps it.
        '422':
          description: The body does not match the contract.
components:
  schemas:
    Event:
      type: object
      required: [id, title, city, starts_at, capacity]
      properties:
        id:
          type: integer
        title:
          type: string
        city:
          type: string
        starts_at:
          type: string
          format: date-time
        capacity:
          type: integer
    Cover:
      type: object
      required: [id, cover]
      properties:
        id:
          type: integer
        cover:
          type: string
    Rsvp:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
