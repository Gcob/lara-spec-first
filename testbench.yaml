laravel: '@testbench'

providers:
  # Composer package discovery reads the manifest of packages installed in
  # vendor/. This package is the root package, so it is never in that manifest
  # and must be registered here by hand — without this line the Workbench
  # application boots without it, silently.
  - Gcob\LaraSpecFirst\LaraSpecFirstServiceProvider
  # Points the package at workbench/openapi.yaml and workbench/app/Http/Generated,
  # because '@testbench' puts base_path() in vendor/ where nothing is committed.
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    # The generated tree is gitignored, like the build output of any real
    # project, so `composer build` is what puts it there. Which is also the
    # workflow a consumer has: `spec:build` belongs in whatever bootstraps your
    # application, not in a step somebody has to remember.
    - spec-build
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
