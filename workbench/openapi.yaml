
# The contract the Workbench application serves.
#
# This file exists to be played with. It is the closest thing this repository has
# to end-to-end: a real Laravel application, booted through `composer serve`,
# whose routes come from nothing but this document and `php artisan spec:build`.
#
# Every operation below is here to make one Phase 1 behaviour visible in the
# generated output rather than only in a test. Edit it, rebuild, and read what
# changed.
openapi: 3.1.0
info:
    title: Workbench API
    version: 1.0.0
    description: >
        A contract with no application behind it yet. Every operation answers 501
        until something implements it, which is the honest answer while the
        specification describes an endpoint and no code does.

paths:
    # Document order decides. This literal path is written above the templated
    # one below, so `GET /users/me` reaches this operation rather than being
    # swallowed by `/users/{id}`. Swap the two blocks, rebuild, and the behaviour
    # swaps with them — that is a documented property of this package, not a bug.
    /users/me:
        get:
            x-controller: Workbench\App\Http\Controllers\ShowCurrentUserController2
            operationId: showCurrentUser
            summary: The authenticated user
            tags: [Users]
            responses:
                '200': { description: The caller }

    /users/{id}:
        # `x-controller` is the whole customization model in one line. It names
        # this operation's controller, so the generated parent takes that short
        # name, drops `final`, and the route points at the child below it —
        # `workbench/app/Http/Controllers/UserController.php`, which answers for
        # real rather than with a 501. Delete the class and rebuild: the route
        # falls back to the generated parent and the 501 comes back.
        get:
            operationId: showUser
            summary: One user by id
            tags: [Users]
            x-controller: Workbench\App\Http\Controllers\Users\ShowUserController
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            responses:
                '200': { description: A user }
                '404': { description: No such user }

        # No `operationId`, on purpose: the generated class name is derived from
        # the method and the path instead, and the file says so in its findings.
        # It becomes `DeleteUsersIdController`.
        delete:
            summary: Remove a user
            tags: [Users]
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            responses:
                '204': { description: Gone }

    /posts:
        # A second `x-controller`, whose class exists and has not been implemented:
        # `workbench/app/Http/Controllers/Posts/ListPostsController.php` is what
        # `spec:make listPosts` wrote, untouched. It still answers 501, because the
        # one line in it calls the parent — which is what keeps a scaffold honest
        # until somebody replaces that line.
        #
        # It also declares a `query` parameter, which is what gives this
        # operation a generated request — and what makes the child below
        # declare one more parameter than it used to. A contract gaining a
        # statement about what a client may send is exactly the change a
        # static analysis error should be reporting.
        get:
            operationId: listPosts
            x-controller: Workbench\App\Http\Controllers\Posts\ListPostsController
            summary: Every post
            tags: [Posts]
            parameters:
                - { name: page, in: query, schema: { type: integer } }
                # Read and never turned into a rule: what a missing credential
                # deserves is a 401 and a rule set answers with a 422. The
                # doctor counts it and exits non-zero until you acknowledge it.
                - { name: X-Trace, in: header, schema: { type: string } }
            # Read into the contract and *not enforced* by this build. The
            # generated controller's findings say so out loud, because an endpoint
            # the contract describes as protected and that nothing protects is the
            # one thing this package must never leave quiet.
            security:
                - bearerAuth: [posts:read]
            responses:
                '200': { description: A list of posts }

        # The `POST` half of the pair below. Same schema as the `PATCH`, and
        # the two generated requests differ in exactly one line each: this one
        # reads the schema's `required` list, and the `PATCH` reads it as empty.
        post:
            operationId: createPost
            summary: Publish a post
            tags: [Posts]
            security:
                - bearerAuth: [posts:write]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NewPost'
            responses:
                '201': { description: Created }

    /posts/{postId}:
        # The `PATCH` half. A partial update is a statement about the
        # resource's representation, so the schema's required list is read as
        # empty here and every property is `sometimes`. Diff the two generated
        # files to see it, and read their Findings blocks for everything the
        # schema states that no rule enforces yet.
        #
        # It also names a controller, so the generated parent is extendable and
        # `workbench/app/Http/Controllers/Posts/UpdatePostController.php` answers
        # for real: it reads `$request->dto()`, the partial input DTO, and says
        # which properties the client sent, which is the question a `PATCH` has
        # to answer without writing a `null` over a stored column.
        patch:
            operationId: updatePost
            x-controller: Workbench\App\Http\Controllers\Posts\UpdatePostController
            summary: Change part of a post
            tags: [Posts]
            parameters:
                - { name: postId, in: path, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NewPost'
            responses:
                '200': { description: Updated }

    /posts/{postId}/attachments:
        # A multipart body, and the one place a part is a file. `cover` becomes
        # `file`, `mimetypes:image/png` and `max:2.44140625` (2500 bytes, exact),
        # `gallery` becomes an array plus the same rules under
        # `gallery.*`, and `anything` states `application/octet-stream`, which
        # means "any bytes" and so adds no `mimetypes`. The generated file's
        # Findings block says that an `encoding` written beside the body is not
        # read yet: until it is, a part's types come from `contentMediaType`.
        post:
            operationId: uploadAttachments
            summary: Attach files to a post
            tags: [Posts]
            parameters:
                - { name: postId, in: path, required: true, schema: { type: string } }
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [cover]
                            properties:
                                cover:
                                    type: string
                                    contentMediaType: image/png
                                    maxLength: 2500
                                gallery:
                                    type: array
                                    maxItems: 5
                                    items:
                                        type: string
                                        contentMediaType: image/*
                                anything:
                                    type: string
                                    contentMediaType: application/octet-stream
                                caption:
                                    type: string
                                    maxLength: 120
            responses:
                '201': { description: Attached }

    /posts/{postId}/legacy-comments:
        # Deprecated with a sunset date. Both reach the generated file's findings,
        # and both are what the doctor will enforce once it exists: a deprecation
        # with no end date is a wish.
        get:
            operationId: listLegacyComments
            summary: Comments, the old way
            tags: [Posts]
            deprecated: true
            x-sunset: '2027-01-01'
            parameters:
                - { name: postId, in: path, required: true, schema: { type: string } }
            responses:
                '200': { description: Comments }

    /pets/{id}:
        # Remote reference vendoring, made visible. `schema` below is a `$ref`
        # naming a URL — the Swagger Petstore demo, the most widely recognized
        # example document in the OpenAPI ecosystem and a stable one to point a
        # demo at. Building this contract with nothing vendored yet fails,
        # naming the flag to run:
        #
        #     php artisan spec:build --update-refs
        #
        # That fetches the document once, commits it under
        # `openapi-external-refs/petstore3.swagger.io/...` (see
        # `workbench/config/lara-spec-first.php`), and rewrites the `$ref`
        # above to point at the committed copy. Every ordinary `spec:build`
        # after that — no flag — resolves it from disk; delete the vendored
        # file and rebuild to see the frozen-by-default refusal again.
        get:
            x-controller: Workbench\App\Http\Controllers\Externals\Pets\ShowPetController
            operationId: showPet
            summary: One pet, described by a schema this contract does not own
            tags: [Pets]
            parameters:
                - { name: id, in: path, required: true, schema: { type: string } }
            responses:
                '200':
                    description: A pet
                    content:
                        application/json:
                            schema:
                                $ref: 'https://petstore3.swagger.io/api/v3/openapi.json#/components/schemas/Pet'

    /internal/cache-warm:
        # `x-audience: internal` changes the effective lifecycle default: a public
        # operation with no claim is `beta`, an internal one makes no claim at
        # all. The generated findings report the effective values rather than what
        # was written, so this file is where you can see the difference.
        post:
            operationId: warmCache
            summary: Not for outside consumers
            tags: [Operations]
            x-audience: internal
            responses:
                '202': { description: Accepted }

components:
    schemas:
        # One schema, two operations, two generated requests. Every keyword
        # below becomes a rule, except the two marked: those are named in the
        # generated file's Findings block rather than enforced, because no
        # Laravel rule means the same thing.
        NewPost:
            type: object
            required: [title, body]
            additionalProperties: false
            properties:
                title:
                    type: string
                    maxLength: 120
                body:
                    type: string
                published:
                    type: boolean
                readingMinutes:
                    type: integer
                    minimum: 1
                summary:
                    type: [string, 'null']
                status:
                    type: string
                    enum: [draft, review, live]
                publishAt:
                    type: string
                    format: date-time
                slug:
                    type: string
                    pattern: '^[a-z0-9-]+$'
                # Reported: `\d` reads as a Unicode class in PCRE under `u`.
                isbn:
                    type: string
                    pattern: '^\d{13}$'
                # Reported: Laravel's `url` refuses a `urn:` JSON Schema allows.
                canonical:
                    type: string
                    format: uri
                tags:
                    type: array
                    maxItems: 5
                    uniqueItems: true
                    items:
                        type: string
                author:
                    type: object
                    required: [name]
                    properties:
                        name:
                            type: string
                        email:
                            type: string
                            format: email

    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
